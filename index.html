<title>Alley Boss</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;600;700;800&display=swap">
<style>
/* Layout: neon marquee header, scrolling alley scene as the hero, floating Run-day dock, chunky arcade-style tabs. Committed night-alley look. */
:root{
  --carpet:#140f33;--panel:#211a4d;--raise:#2d2563;--line:rgba(255,255,255,.12);--fg:#fff8ec;--muted:#b3acd9;
  --cash:#36f0b5;--cashD:#17a678;--cherry:#ff4d6d;--cherryD:#b8213f;--amber:#ffc83d;--amberD:#c48a00;--violet:#b98cff;--sky:#4fb3ff;--pink:#ff7ad9;
  --display:"Bungee",Impact,system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,sans-serif;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--carpet);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.35;min-height:100%;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 20% 30%,rgba(185,140,255,.16) 0 2px,transparent 3px),radial-gradient(circle at 70% 80%,rgba(255,200,61,.13) 0 2.5px,transparent 3.5px),radial-gradient(circle at 40% 70%,rgba(54,240,181,.12) 0 1.5px,transparent 2.5px),radial-gradient(circle at 85% 20%,rgba(255,122,217,.13) 0 2px,transparent 3px);
  background-size:46px 46px,58px 58px,38px 38px,64px 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--carpet)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button:disabled{cursor:not-allowed;filter:grayscale(.7);opacity:.5}

/* marquee header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(var(--carpet) 85%,rgba(20,15,51,0))}
.marq{max-width:640px;margin:0 auto;position:relative;border-radius:18px;padding:10px 14px 9px;background:linear-gradient(160deg,#2b1f63,#1b1446);
  box-shadow:0 0 0 3px #3a2b7c,0 0 0 5px #120d2c,0 8px 24px rgba(0,0,0,.5)}
.marq::before{content:"";position:absolute;inset:3px;border-radius:15px;pointer-events:none;
  background:radial-gradient(circle,var(--amber) 0 1.6px,transparent 2.2px) 0 0/12px 12px;
  -webkit-mask:linear-gradient(#000 0 0) top/100% 5px no-repeat,linear-gradient(#000 0 0) bottom/100% 5px no-repeat;mask:linear-gradient(#000 0 0) top/100% 5px no-repeat,linear-gradient(#000 0 0) bottom/100% 5px no-repeat;animation:chase 1.2s steps(2) infinite;opacity:.85}
@keyframes chase{to{background-position:6px 0}}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.alleyname{font:400 .95rem var(--display);color:#fff;text-shadow:0 0 6px var(--pink),0 0 14px var(--pink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rankb{flex:none;font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--violet);color:#1e0b44}
.cash{font:400 1.9rem/1.05 var(--display);color:var(--cash);text-shadow:0 0 10px rgba(54,240,181,.55);font-variant-numeric:tabular-nums}
.cash.neg{color:var(--cherry);text-shadow:0 0 10px rgba(255,77,109,.5)}
.cash.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.08)}}

<script>

  {id:'influ',n:'Pay an influencer',cost:4000,days:4,b:{teen:.6,date:.4},d:'Teens +60%, dates +40% for 4 days'},

];
const LOANS=[{amt:10000,total:12000,days:20},{amt:50000,total:60000,days:30},{amt:250000,total:300000,days:40}];

  {id:'grand',n:'The Grand on the Strip',cost:12000000,inc:210000}

const RANKS=[{n:'Dive',w:0},{n:'Neighborhood Spot',w:50000},{n:'Town Favorite',w:200000},{n:'Regional Hotspot',w:1000000},{n:'Bowling Mogul',w:5000000},{n:'Bowling Empire',w:50000000}];
const PKG={Basic:18,Deluxe:30,VIP:55};
const FIRST=['Maya','Jordan','Liam','Ava','Noah','Zoe','Eli','Harper','Mason','Ruby','Leo','Isla','Cole','Nora','Theo','Lily','Owen','Ella'];
const COS=['Halvorsen Plumbing','Brightline Dental','Kessler Auto','Northgate Realty','Pine & Oak Law','Summit Roofing','Bluewater Insurance','Copperleaf Bakery','Redline Logistics','Fairview Middle School PTA'];

/* ================= state ================= */
const SAVE='alley-boss-v1';
function fresh(){return{
  v:1,name:'Rusty Pin Lanes',cash:6000,day:1,hour:HOURS_OPEN,speed:1,rep:30,clean:70,
  lanes:[0,0,0,0].map(()=>({tier:0,cond:70,broken:false,busy:0,seg:null,res:null,fixAt:0})),
  slots:6,expand:0,food:0,bar:0,arcade:0,rooms:0,decor:0,amen:{},
  price:{game:4,shoes:3},
  staff:{desk:0,mech:0,jan:0,cook:0,bt:0,host:0,mgr:0},train:{desk:1,mech:1,jan:1,cook:1,bt:1,host:1,mgr:1},
  mkt:[],boosts:[],offers:[],booked:[],leagues:[null,null,null,null],tourn:null,tournNext:0,
  loans:[],fran:{},rival:null,rivalDone:false,closedUntil:0,
  hist:[],today:null,feed:[],goalsDone:{},lifetime:0,invested:0,partiesTotal:0,best:0,gameOver:false,dayOpen:true,
  wear:{interior:100,kitchen:100,bar:100,arcade:100},week:null,rankSeen:0,lastTax:0,
  debt:{bal:200000,rate:.0003,weekly:1000,paidWk:0,start:200000,grace:15},tut:0,preOpen:true
}}
let S;
try{S=JSON.parse(localStorage.getItem(SAVE)||'null')}catch(e){S=null}
if(!S||S.v!==1)S=fresh();
if(!S.debt)S.debt={bal:0,rate:.0004,min:120,start:0};
if(S.tut==null)S.tut=0;
if(!S.debt.start&&!S.loanFixed){S.loanFixed=1;S.debt={bal:200000,rate:.0003,weekly:1000,paidWk:0,paidTotal:0,start:200000,grace:S.day+14};setTimeout(()=>{feed('The bank caught up with you: you owe $200,000 for this place. No interest or payments for 2 weeks.','bad');render()},0)}
if(!S.gift56k){S.gift56k=1;S.cash+=56000;setTimeout(()=>{toast('+$56,000 from the boss 💰');boom()},600)}
if(S.debt.start&&S.debt.grace==null){S.debt.rate=.0003;S.debt.grace=15}
if(S.debt.weekly==null){S.debt.weekly=1000;S.debt.paidWk=0}
if(S.debt.paidTotal==null)S.debt.paidTotal=Math.max(0,S.debt.start-S.debt.bal);
if(!S.wear){S.wear={interior:100,kitchen:100,bar:100,arcade:100};S.week=null;S.lastTax=0}
if(!S.today)newToday();
if(!S.week||['satwalk','clean','stars','guests','parties'].includes(S.week.type))setTimeout(()=>{newWeek();render()},0);
function newToday(){S.today={rev:{games:0,shoes:0,food:0,bar:0,arcade:0,shop:0,party:0,league:0,tourn:0},exp:{},guests:0,groups:0,lost:0,parties:0,repStart:S.rep,cashStart:S.cash}}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function money(n,short){const neg=n<0;n=Math.abs(n);let s;
  if(short&&n>=1e6)s='$'+(n/1e6).toFixed(n>=1e7?1:2).replace(/\.0+$/,'')+'M';
  else if(short&&n>=1e4)s='$'+(n/1e3).toFixed(n>=1e5?0:1).replace(/\.0$/,'')+'K';
  else s='$'+Math.round(n).toLocaleString('en-US');
  return(neg?'−':'')+s}
function poisson(l){if(l<=0)return 0;if(l>30)return Math.max(0,Math.round(l+Math.sqrt(l)*(Math.random()*2-1)*1.2));let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
const absH=()=>(S.day-1)*24+S.hour;
const stars=()=>clamp(S.rep/20,0,5);
const dow=(d=S.day)=>(d-1)%7;
function hourLabel(h){h=Math.floor(h)%24;const ap=h>=12?'PM':'AM';const x=h%12||12;return x+' '+ap}
function timeLabel(){const h=Math.floor(S.hour),m=Math.min(59,Math.floor((S.hour-h)*60));const ap=h>=12&&h<24?'PM':'AM';return (h%12||12)+':'+String(m).padStart(2,'0')+' '+ap}
function eff(role){return [0,1,1.25,1.5][S.train[role]]}
function wage(role){return STAFF[role].wage*(1+.15*(S.train[role]-1))}
function has(id){return !!S.amen[id]}
function spend(c,cat='other'){S.cash-=c;S.today.exp[cat]=(S.today.exp[cat]||0)+c}
function invest(c){S.cash-=c;S.invested+=c;S.today.exp.build=(S.today.exp.build||0)+c}
function earn(c,cat){S.cash+=c;S.today.rev[cat]+=c;S.lifetime+=c}
function feed(txt,kind='info',st){S.feed.unshift({t:'Day '+S.day+' · '+hourLabel(S.hour),txt,kind,st});if(S.feed.length>40)S.feed.length=40}
let toastT=0;function toast(t,ms=1800){const el=$('#toast');el.textContent=t;el.style.opacity=1;el.style.whiteSpace=ms>2000?'normal':'nowrap';el.style.textAlign='center';clearTimeout(toastT);toastT=setTimeout(()=>el.style.opacity=0,ms)}
const INFO={'Today':'💵 Money made so far today.','Guests':'👥 People who came in to bowl today.','Walked out':'🚪 Groups who left because every lane was full or the front desk was swamped.','Clean':'🧽 How clean the place is. Janitors keep it up. Low means bad reviews.','Lanes':'🔧 Average lane condition. Mechanics slow the wear. Resurface in Build.','Jammed':'🚨 Lanes with a stuck pinsetter. Tap the lane to fix it, or hire a mechanic.'};

/* ================= derived ================= */
function avgQ(){const L=S.lanes;return L.reduce((a,l)=>a+TIERS[l.tier].q,0)/L.length}
function avgCond(){return S.lanes.reduce((a,l)=>a+l.cond,0)/S.lanes.length}
function laneScore(){return S.lanes.reduce((a,l)=>a+TIERS[l.tier].q*(.4+.6*l.cond/100)*(l.broken?.3:1),0)/S.lanes.length}
function foodLvl(){let l=S.food;while(l>=2&&S.staff.cook<FOOD[l].cooks)l--;return l}
function barLvl(){let l=S.bar;while(l>=1&&S.staff.bt<BAR[l].bt)l--;return l}
function mechCover(){return clamp(S.staff.mech*8*eff('mech')/S.lanes.length,0,1)}
function partyMult(){let m=DECOR[S.decor].party||0;for(const a of AMEN)if(has(a.id))m+=a.party||0;return m}
function fairGame(){return 3+avgQ()*4+stars()*.45}
function fairShoes(){return 2.5+stars()*.35+avgQ()}
function ratio(){return(S.price.game/fairGame()*.7+S.price.shoes/Math.max(.5,fairShoes())*.3)}
function priceTag(r){return r<.8?'Cheap':r<1.1?'Fair':r<1.3?'Pricey':'Ripoff'}
function appeal(k){
  let a=SEG[k].base;
  for(const x of AMEN)if(has(x.id)&&x.ap&&x.ap[k])a+=x.ap[k]*SEG[k].base*2.2;
  if(k==='fam'||k==='teen')a+=Math.min(S.arcade,20)*.012*SEG[k].arc;
  a+=(foodLvl())*.05*SEG[k].food;
  a+=(barLvl())*.07*SEG[k].bar;
  const led=S.lanes.filter(l=>l.tier===4).length/S.lanes.length;
  if(k==='teen'||k==='date')a+=led*.25;
  if(k==='pro')a+=Math.max(0,avgQ()-.5)*1.2;
  if(k==='corp')a+=S.rooms*.08;
  return a}
function boost(k){let b=1;for(const m of S.mkt){const d=MKT.find(x=>x.id===m.id);if(d.b[k])b+=d.b[k]}for(const e of S.boosts)if(e.ap[k])b+=e.ap[k];return b}
function repTarget(){
  let t=19+laneScore()*34+S.clean*.17+foodLvl()*3.2+barLvl()*2.2+Math.min(S.arcade,20)*.15;
  let ar=0;for(const a of AMEN)if(has(a.id))ar+=a.rep||0;
  t+=(ar+S.decor*1.5)*(.6+.4*S.wear.interior/100)+S.rooms*1;
  for(const k in WEAR)if(wearOn(k)&&S.wear[k]<60)t-=(60-S.wear[k])*.25;
  t-=rank()*6;
  if(S.staff.mgr)t+=3;
  const T=S.today,seen=T.groups+T.lost;if(seen>4)t-=T.lost/seen*22;
  const r=ratio();if(r>1.05)t-=(r-1.05)*45;else if(r<.85)t+=4;
  if(S.food>=2&&foodLvl()<S.food)t-=4;if(S.bar>=1&&barLvl()<S.bar)t-=3;
  return clamp(t,0,100)}
function netWorth(){let w=S.cash+S.invested*.55;for(const f of FRAN)if(S.fran[f.id])w+=f.cost*(1+.5*(S.fran[f.id]-1))*.8;for(const l of S.loans)w-=l.left*l.per;return w-S.debt.bal}
function rank(){let r=0;const w=netWorth();RANKS.forEach((x,i)=>{if(w>=x.w)r=i});return r}
function wagesTotal(){let w=0;for(const k in STAFF)w+=S.staff[k]*wage(k);return w}
function rentTotal(){return 220+EXPAND.slice(0,S.expand).reduce((a,e)=>a+e.rent,0)}
function utilTotal(){return 12*S.lanes.length+20*(S.food+S.bar)+2*S.arcade+(has('ac')?40:0)+S.rooms*15}
const WEAR={interior:{n:'Interior & decor',d:'Carpet, booths, paint, restrooms.'},kitchen:{n:'Kitchen',d:'Fryers, grill, fridges.'},bar:{n:'Bar',d:'Taps, coolers, stools.'},arcade:{n:'Arcade',d:'Joysticks, claws, screens.'}};
function wearOn(k){return k==='interior'||(k==='kitchen'&&S.food>=1)||(k==='bar'&&S.bar>=1)||(k==='arcade'&&S.arcade>0)}
function wf(k){return .55+.45*S.wear[k]/100}
function renoBase(k){if(k==='kitchen')return FOOD.slice(1,S.food+1).reduce((a,f)=>a+f.cost,0);if(k==='bar')return BAR.slice(1,S.bar+1).reduce((a,f)=>a+f.cost,0);if(k==='arcade')return S.arcade*1800;return 6000+AMEN.filter(a=>has(a.id)).reduce((a,x)=>a+x.cost,0)+DECOR.slice(1,S.decor+1).reduce((a,d)=>a+d.cost,0)}
function renoCost(k){return Math.max(200,Math.round(renoBase(k)*(100-S.wear[k])/100*.35/10)*10)}
function franInc(){let s=0;for(const f of FRAN)if(S.fran[f.id])s+=f.inc*(1+.6*(S.fran[f.id]-1));return s}
function loanPay(){return S.loans.reduce((a,l)=>a+l.per,0)}

/* ================= simulation ================= */
function reserveFor(h){
  /* returns map laneIndex->reason for this hour */
  const need=[];
  for(const b of S.booked)if(b.day===S.day&&h>=b.hour&&h<b.hour+2)need.push({n:b.lanes,r:'party'});
  const lg=S.leagues[dow()];if(lg&&dow()<4&&h>=19&&h<22)need.push({n:lg.lanes,r:'league'});
  if(S.tourn&&S.tourn.day===S.day&&h>=10&&h<16)need.push({n:S.lanes.length,r:'tourn'});
  const res={};let i=S.lanes.length-1;
  for(const x of need)for(let k=0;k<x.n&&i>=0;k++,i--){while(i>=0&&S.lanes[i].broken)i--;if(i>=0)res[i]=x.r}
  return res}
function wearLane(l,uses){
  const cov=mechCover();
  l.cond=clamp(l.cond-uses*.9*TIERS[l.tier].wear*(1-cov*.6),0,100);
  const p=(1.12-l.cond/100)*.045*TIERS[l.tier].brk*(1-cov*.55)*(S.staff.mgr?.8:1);
  if(!l.broken&&Math.random()<p*uses){l.broken=true;l.fixAt=absH()+1;return true}
  return false}
function hourTick(h){
  const T=S.today,idx=h-HOURS_OPEN,H0=(S.day-1)*24+h;
  /* mechanics fix jams */
  const cov=mechCover();
  S.lanes.forEach((l,i)=>{if(l.broken&&absH()>=l.fixAt&&(Math.random()<cov||(S.staff.mgr&&Math.random()<.5))){l.broken=false;l.cond=Math.max(l.cond,45);}});
  if(S.closedUntil>absH()){S.lanes.forEach(l=>{l.busy=0;l.seg=null;l.res=null});return}
  const res=reserveFor(h);
  S.lanes.forEach((l,i)=>{l.res=res[i]||null;if(l.res){l.busy=H0+1;l.seg=null}});
  /* events that start now */
  for(const b of S.booked)if(b.day===S.day&&b.hour===h)runParty(b);
  S.booked=S.booked.filter(b=>!(b.day<S.day||(b.day===S.day&&b.hour<=h-2)));
  const lg=S.leagues[dow()];
  if(lg&&dow()<4&&h===19){const bowlers=Math.round(lg.lanes*5*lg.fill);
    earn(bowlers*16,'league');earn(Math.round(bowlers*BAR[barLvl()].spend*.7+bowlers*FOOD[foodLvl()].spend*.4),'league');
    T.guests+=bowlers;S.lanes.forEach(l=>{if(l.res==='league')wearLane(l,1.5)});
    if(Math.random()<.4)feed(DOW[dow()]+' league: '+bowlers+' bowlers showed up.','good')}
  if(S.tourn&&S.tourn.day===S.day&&h===10&&!S.tourn.done)runTourn();
  /* walk-ins */
  const free=S.lanes.filter(l=>!l.broken&&!l.res);

  const repF=.35+S.rep/100*1.35,priceF=clamp(Math.exp(-1.7*(ratio()-1)),.2,1.35),rivalF=S.rival?.82:1;

    const n=poisson(lam);for(let j=0;j<n;j++)groups.push(k)}
  groups.sort(()=>Math.random()-.5);
  let lost=0,guests=0;
  const mgr=S.staff.mgr?1.08:1;
  for(const k of groups){

    const lane=free[free.length-freeN];freeN--;cap--;
    const sg=SEG[k],size=ri(sg.size[0],sg.size[1]),c0=S.cash;
    lane.busy=H0+1;lane.seg=k;guests+=size;
    earn(Math.round(size*sg.games*S.price.game*mgr),'games');

    if(S.arcade)earn(Math.round(size*Math.min(S.arcade*.6,14)*sg.arc*rnd(.6,1.2)*wf('arcade')),'arcade');
    if(has('proshop')&&k==='pro')earn(Math.round(size*6*rnd(.5,2)),'shop');
    paid(S.lanes.indexOf(lane),S.cash-c0);

  }
  S.lanes.forEach(l=>{if(l.busy<=H0)l.seg=null});
  T.guests+=guests;T.groups+=groups.length-lost;T.lost+=lost;
  if(lost>=3&&Math.random()<.5)feed(lost+' groups walked out. '+(cap<=0?'The front desk was swamped.':'Every lane was full.'),'bad');
  /* cleanliness */
  S.clean=clamp(S.clean-guests*.11+S.staff.jan*2.4*eff('jan')+.6+(has('restroom')?.6:0),0,100);
  /* reputation */
  S.rep=clamp(S.rep+(repTarget()-S.rep)*.05,0,100);

  if(S.rooms&&h<=20&&S.offers.length<4&&Math.random()<.07*S.rooms*repF*(1+partyMult())*(dow()>=4?1.4:1))makeOffer();
  S.offers=S.offers.filter(o=>{if(o.exp<=absH()){return false}return true});
  if(Math.random()<.16&&guests)review();
  checkGoals();
}

function laneCost(){return 7500+Math.max(0,S.lanes.length-4)*900}
function arcadeCost(){return 1800+S.arcade*120}
function tierAllCost(t){return S.lanes.filter(l=>l.tier<t).length*TIERS[t].cost}
function serviceCost(){return Math.round(S.lanes.reduce((a,l)=>a+(100-l.cond)*7+(l.broken?150:0),0))}
function trainCost(r){return S.train[r]===1?1500:5000}
function tournReady(){return !S.tourn&&S.day>=S.tournNext&&S.lanes.filter(l=>l.tier>=3).length>=8}

/* ---------- the alley scene ---------- */
const SC={LU:40,LW:26,PAD:12,WALL:20,LANE:108,APP:18,SEAT:44};
const SCH=SC.WALL+SC.LANE+SC.APP+SC.SEAT;
let cv,ctx,AN=[],pops=[],sceneScroll=0,lastNow=performance.now();
function sizeFloor(){

  cv.style.width=w+'px';cv.style.height=SCH+'px';cv.width=w*d;cv.height=SCH*d;ctx.setTransform(d,0,0,d,0,0);
  wrap.scrollLeft=sceneScroll;wrap.onscroll=()=>{sceneScroll=wrap.scrollLeft};

}
const PINS=[];for(let k=0;k<4;k++)for(let i=0;i<=k;i++)PINS.push({k,i});
function laneX(i){return SC.PAD+i*SC.LU+(SC.LU-SC.LW)/2}
function pinPos(i,p){const sp=SC.LW*.29,cx=laneX(i)+SC.LW/2,headY=SC.WALL+40;return{x:cx+(p.i-p.k/2)*sp,y:headY-p.k*sp*.86}}

function laneSkill(i){const l=S.lanes[i],seg=l.seg||(l.res==='league'||l.res==='tourn'?'pro':'fam');return({pro:.42,corp:.12,date:.14,teen:.16,fam:.12})[seg]+TIERS[l.tier].q*.12}
function knock(a,i,n){
  const up=a.up.map((u,k)=>u?k:-1).filter(k=>k>=0);
  const hitX=a.off+a.curve;
  up.sort((p,q)=>(Math.abs(PINS[p].i-PINS[p].k/2-hitX*.08)+PINS[p].k*.6+Math.random()*1.4)-(Math.abs(PINS[q].i-PINS[q].k/2-hitX*.08)+PINS[q].k*.6+Math.random()*1.4));

  for(const k of hit){a.up[k]=false;const p=pinPos(i,PINS[k]),cx=laneX(i)+SC.LW/2,ang=Math.atan2(p.y-(SC.WALL+60),p.x-cx+(Math.random()-.5)*6);

}
function stepAnim(i,dt){
  const l=S.lanes[i],occ=S.dayOpen&&l.busy>absH()&&(l.seg||l.res)&&!l.broken;
  let a=AN[i]||(AN[i]=newAnim());
  if(!occ){if(a.ph!=='idle'||a.fall.length||a.up.includes(false))AN[i]=newAnim();return}
  a.t+=dt;if(a.txtT>0)a.txtT-=dt;
  for(const f of a.fall){if(a.ph==='hit'||a.ph==='settle'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=Math.pow(.05,dt);f.vy*=Math.pow(.05,dt);f.rot+=f.vr*dt;f.vr*=Math.pow(.1,dt);

  if(a.ph==='idle'&&a.t>a.wait){a.ph='approach';a.t=0}
  else if(a.ph==='approach'&&a.t>1.1){a.ph='roll';a.t=0;a.dur=rnd(2.3,3.1);a.off=rnd(-.35,.35)*SC.LW;a.curve=rnd(-.25,.25)*SC.LW}

    else{n=Math.random()<sk+.3?left:Math.floor(Math.random()*left)}

    if(a.txt==='STRIKE!')pops.push({x:laneX(i)+SC.LW/2,y:SC.WALL+70,txt:'STRIKE!',col:'#ff7ad9',t:0,big:1});
    a.ph='hit';a.t=0}
  else if(a.ph==='hit'&&a.t>.8){a.ph='settle';a.t=0}
  else if(a.ph==='settle'&&a.t>.9){a.ph='sweep';a.t=0}

function groupOf(l){if(l.seg)return{n:l.seg==='date'?2:l.seg==='pro'?2:l.seg==='corp'?6:4,col:SEG[l.seg].col};if(l.res==='party')return{n:6,col:null};if(l.res==='league')return{n:5,col:'#36f0b5'};if(l.res==='tourn')return{n:4,col:'#4fb3ff'};return{n:0}}

    if(l.tier===4||cosmic){ctx.strokeStyle=cosmic?'#b98cff':'#6ff3ff';ctx.lineWidth=1.5;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(x+.5,topL);ctx.lineTo(x+.5,botL);ctx.moveTo(x+SC.LW-.5,topL);ctx.lineTo(x+SC.LW-.5,botL);ctx.stroke();ctx.shadowBlur=0}

function paid(i,amt){if(amt>0&&i>=0)pops.push({x:laneX(i)+SC.LW/2,y:SC.WALL+SC.LANE+SC.APP+6,txt:'+'+money(amt),col:'#36f0b5',t:Math.random()*.2})}

  (function f(){t++;g.clearRect(0,0,innerWidth,innerHeight);for(const p of P){p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);g.restore()}if(t<110)requestAnimationFrame(f);else g.clearRect(0,0,innerWidth,innerHeight)})()}

function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const f=v=>Math.round(clamp(v+(p<0?v*p:(255-v)*p),0,255));return `rgb(${f(r)},${f(g)},${f(b)})`}
addEventListener('resize',()=>{if(tab==='alley'){sizeFloor()}});

/* ================= main loop ================= */
let last=performance.now(),lastHour=S.hour>HOURS_OPEN?Math.floor(S.hour):HOURS_OPEN-1,uiT=0,needRender=false;
const MS_PER_HOUR=420,SLOW_MS=20000;let running=false,runTo=0;
function frame(now){
  const dt=Math.min(250,now-last);last=now;
  if(S.dayOpen&&!sheetOpen&&!S.gameOver&&!S.preOpen){
    if(running){S.hour=Math.min(runTo,S.hour+dt/MS_PER_HOUR);if(S.hour>=runTo-1e-9){S.hour=runTo;running=false;uiT=999}}
    else if($('#splash').hidden&&$('#story').hidden)S.hour=Math.min(HOURS_CLOSE,S.hour+dt/SLOW_MS);
    while(lastHour<Math.min(Math.floor(S.hour),HOURS_CLOSE-1)){lastHour++;hourTick(lastHour);uiT=999;needRender=true}
    if(S.hour>=HOURS_CLOSE){S.hour=HOURS_CLOSE;running=false;endDay()}
  }
  uiT+=dt;
  if(uiT>500){uiT=0;tutCheck();renderTop();badge();if(tab==='alley'&&!sheetOpen)liveAlley();else if(needRender&&!sheetOpen&&!(document.activeElement&&document.activeElement.tagName==='INPUT')){const y=scrollY;render();scrollTo(0,y)}needRender=false}
  if(tab==='alley')drawFloor(now);
  const ck=$('#hClock'),ct='<b>Day '+S.day+'</b> · '+DOW[dow()]+' · '+(S.dayOpen?(S.preOpen?'Doors closed':timeLabel()):'Closed')+(S.closedUntil>absH()?' · ⚡ Power out':'');if(ck.innerHTML!==ct)ck.innerHTML=ct;
  requestAnimationFrame(frame)}
let lastFeedLen=-1,lastLanes=-1,lastWarn='';
function liveAlley(){
  const ch=document.querySelector('.chips');if(ch)ch.outerHTML=chips();
  const w=warnings();
  if(S.lanes.length!==lastLanes||S.feed.length&&S.feed[0].t+S.feed[0].txt!==lastFeedLen||w!==lastWarn){
    lastLanes=S.lanes.length;lastFeedLen=S.feed.length?S.feed[0].t+S.feed[0].txt:'';lastWarn=w;
    const y=scrollY;const a=document.activeElement&&['range','number','text'].includes(document.activeElement.type);if(a)return;render();scrollTo(0,y)}
}
if(!S.dayOpen)openDay();
render();
if(S.day===1&&S.hour===HOURS_OPEN&&!S.feed.length){feed('You borrowed $200,000 from the bank to buy '+S.name+'. Four worn lanes, vending machines and a carpet from 1987. Time to build, and pay it back.','info');render()}

/* ================= splash + story ================= */
const STORY=[
  {ch:'Chapter 1',a:['🎳','🏆','👟'],t:'For eleven years you were the best bowler in the Tuesday night league at <b>Rusty Pin Lanes</b>. Same lane. Same ball. Same lucky socks.'},
  {ch:'Chapter 2',a:['👴','🌴','🧳'],t:'Then old <b>Gus</b>, who’d owned the place since 1979, announced he was retiring to Florida. “Somebody buy this dump,” he said. Nobody laughed.'},
  {ch:'Chapter 3',a:['🏚️','🪳','📉'],t:'Four warped lanes. A pinsetter on lane 3 that hates everyone. Vending-machine dinners. A carpet older than you. <b>Nobody wanted it.</b> Except you.'},
  {ch:'Chapter 4',a:['🏦','✍️','💸'],t:'You walked into the bank and signed for <b>$200,000</b>. The loan officer didn’t blink. You did. Twice.'},
  {ch:'Chapter 5',a:['🔑','📝','💡'],t:'Gus handed you the keys and a sticky note: <b>“Don’t let lane 3 bully you. And never touch the thermostat.”</b>'},
  {ch:'Now',a:['🌟','🎉','🏙️'],t:'The lights flicker on. The ball return groans awake. Time to turn a dive into the <b>best bowling alley in the state.</b>'}
];
let storyI=0,typeT=0,typing=false,fullTxt='';
function showStory(){storyI=0;$('#story').hidden=false;$('#story').classList.remove('fade');drawPanel()}
function drawPanel(){
  const s=STORY[storyI],last=storyI===STORY.length-1;
  $('#panel').className='panel';void $('#panel').offsetWidth;$('#panel').className='panel in';
  $('#panel').innerHTML=`<div class="art"><span class="a1">${s.a[0]}</span><span class="a2">${s.a[1]}</span><span class="a3">${s.a[2]}</span></div>
  <div class="chap">${s.ch}</div><div class="stxt" id="stxt"></div>
  <div class="dots">${STORY.map((_,k)=>`<i class="${k===storyI?'on':''}"></i>`).join('')}</div>
  <button class="snext" id="sNext">${last?'Grab the keys 🔑':'Next ▸'}</button>`;
  fullTxt=s.t;typeOut();
  $('#sNext').onclick=()=>{if(typing){finishType();return}if(last)endStory();else{storyI++;drawPanel()}};
}
function typeOut(){const el=$('#stxt');let i=0;typing=true;clearInterval(typeT);
  const plain=fullTxt.replace(/<[^>]+>/g,'');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){finishType();return}
  typeT=setInterval(()=>{i+=2;if(i>=plain.length){finishType();return}
    let n=0,out='',inTag=false;for(const ch of fullTxt){if(ch==='<')inTag=true;if(inTag){out+=ch;if(ch==='>')inTag=false;continue}if(n>=i)break;out+=ch;n++}
    el.innerHTML=out+(out.lastIndexOf('<b>')>out.lastIndexOf('</b>')?'</b>':'')},28)}
function finishType(){clearInterval(typeT);typing=false;const el=$('#stxt');if(el)el.innerHTML=fullTxt}
function endStory(){clearInterval(typeT);S.storySeen=true;save();const st=$('#story');st.classList.add('fade');setTimeout(()=>{st.hidden=true},450);toast('Welcome to your alley! Tap Open the doors when you are ready.')}
$('#sSkip').onclick=endStory;

/* splash: a ball rolls down a perspective lane and blows up the rack */
const SHOW_SPLASH=true; /* flip to true for the real release */
(function splash(){
  const el=$('#splash'),c=$('#splashCv'),g=c.getContext('2d');
  if(!SHOW_SPLASH){el.hidden=true;if(!S.storySeen)showStory();return}let W,H,d,t0=performance.now(),alive=true,shake=0,flash=0;
  function size(){d=Math.min(2,devicePixelRatio||1);W=c.clientWidth;H=c.clientHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}
  size();addEventListener('resize',size);
  const yH=()=>H*.3,A=()=>H*1.04-yH(),B=()=>Math.min(W*.46,H*.3);
  const P=(u,z,y=0)=>({x:W/2+u*B()/z,y:yH()+A()/z-y*B()/z,s:B()/z});
  const ZP=4.1;let pins,ball,phase;
  function reset(){pins=[];for(let k=0;k<4;k++)for(let i=0;i<=k;i++)pins.push({u:(i-k/2)*.58,z:ZP+k*.09,y:0,vu:0,vz:0,vy:0,rot:0,vr:0,dir:1,hit:false});
    ball={u:.62,z:1.05,t:0};phase='roll'}
  reset();
  function pinShape(x,y,s,rot,dir){const h=s*.72;g.save();g.translate(x,y);g.rotate(rot*dir);
    const gr=g.createLinearGradient(-h*.2,0,h*.2,0);gr.addColorStop(0,'#d9d2c4');gr.addColorStop(.45,'#ffffff');gr.addColorStop(1,'#cfc6b6');g.fillStyle=gr;
    g.beginPath();g.moveTo(-h*.09,0);g.bezierCurveTo(-h*.22,-h*.18,-h*.2,-h*.42,-h*.08,-h*.6);g.bezierCurveTo(-h*.05,-h*.68,-h*.1,-h*.8,-h*.08,-h*.9);
    g.bezierCurveTo(-h*.06,-h*1.02,h*.06,-h*1.02,h*.08,-h*.9);g.bezierCurveTo(h*.1,-h*.8,h*.05,-h*.68,h*.08,-h*.6);g.bezierCurveTo(h*.2,-h*.42,h*.22,-h*.18,h*.09,0);g.closePath();g.fill();
    g.fillStyle='#e0284a';g.fillRect(-h*.07,-h*.66,h*.14,h*.035);g.fillRect(-h*.065,-h*.61,h*.13,h*.025);g.restore()}
  function draw(now){
    if(!alive)return;const dt=Math.max(0,Math.min(.05,(now-t0)/1000));t0=now;
    g.save();if(shake>0){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}
    g.fillStyle='#07051a';g.fillRect(-20,-20,W+40,H+40);
    /* glow behind pins */
    const rg=g.createRadialGradient(W/2,yH()+A()/ZP-30,10,W/2,yH()+A()/ZP,W*.7);rg.addColorStop(0,'rgba(185,140,255,.35)');rg.addColorStop(1,'rgba(7,5,26,0)');g.fillStyle=rg;g.fillRect(0,0,W,H);
    /* side lanes, dim */
    for(const off of [-2.6,2.6]){g.fillStyle='rgba(201,139,79,.12)';const a=P(off-1,1),b=P(off+1,1),c2=P(off+1,ZP+.5),e=P(off-1,ZP+.5);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.lineTo(c2.x,c2.y);g.lineTo(e.x,e.y);g.fill()}
    /* gutters */
    g.fillStyle='#0d0a1e';{const a=P(-1.3,.95),b=P(1.3,.95),c2=P(1.3,ZP+.5),e=P(-1.3,ZP+.5);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.lineTo(c2.x,c2.y);g.lineTo(e.x,e.y);g.fill()}
    /* lane */
    {const a=P(-1,.95),b=P(1,.95),c2=P(1,ZP+.5),e=P(-1,ZP+.5);const lg=g.createLinearGradient(0,e.y,0,a.y);lg.addColorStop(0,'#f1d79c');lg.addColorStop(1,'#c98b4f');g.fillStyle=lg;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.lineTo(c2.x,c2.y);g.lineTo(e.x,e.y);g.fill();
      g.strokeStyle='rgba(110,60,20,.18)';g.lineWidth=1;for(let k=-19;k<=19;k++){const u=k/19.5,p1=P(u,.95),p2=P(u,ZP+.5);g.beginPath();g.moveTo(p1.x,p1.y);g.lineTo(p2.x,p2.y);g.stroke()}
      g.strokeStyle='#b98cff';g.lineWidth=2;g.shadowColor='#b98cff';g.shadowBlur=12;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(e.x,e.y);g.moveTo(b.x,b.y);g.lineTo(c2.x,c2.y);g.stroke();g.shadowBlur=0;
      g.fillStyle='rgba(50,22,8,.6)';for(let k=-3;k<=3;k++){const z=1.9+Math.abs(k)*.07,p=P(k*.27,z),s=p.s*.05;g.beginPath();g.moveTo(p.x,p.y-s*2.2);g.lineTo(p.x-s*.7,p.y+s*.4);g.lineTo(p.x+s*.7,p.y+s*.4);g.fill()}}
    /* masking unit */
    {const p=P(0,ZP+.55),w=p.s*2.6,h=p.s*.55;g.fillStyle='#1b1446';g.fillRect(p.x-w/2,p.y-h*2.4,w,h);g.font=`400 ${Math.max(10,h*.45)}px Bungee, Impact, sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillStyle='#ffc83d';g.shadowColor='#ffc83d';g.shadowBlur=14;g.fillText(phase==='boom'||phase==='rest'?'STRIKE!':'LANE 1',p.x,p.y-h*1.9);g.shadowBlur=0}
    /* pins (back to front) */
    const ordered=pins.slice().sort((a,b)=>b.z-a.z);
    /* ball */
    if(phase==='roll'){ball.t+=dt;const k=Math.min(1,ball.t/1.7),e=k*k*.35+k*.65;ball.z=1.05+(ZP-1.05)*e;ball.u=.62-.5*Math.pow(k,2.2);
      if(k>=1){phase='boom';shake=14;flash=1;for(const p of pins){const du=p.u-ball.u,dz=p.z-ZP+.12;p.vu=du*3+(Math.random()-.5)*2.2;p.vz=.1+Math.random()*.45;p.vy=1.2+Math.random()*3;p.vr=(Math.random()*8+4);p.dir=Math.random()<.5?-1:1;p.hit=true}}}
    if(phase==='boom'||phase==='rest'){for(const p of pins){p.u+=p.vu*dt;p.z+=p.vz*dt;p.vy-=6.5*dt;p.y+=p.vy*dt;if(p.y<0){p.y=0;p.vy=p.vy<-1?-p.vy*.3:0;p.vu*=.6;p.vz*=.6}p.rot=Math.min(Math.PI/2,p.rot+p.vr*dt);p.vu*=.99;if(p.u>1.25)p.u=1.25,p.vu*=-.4;if(p.u<-1.25)p.u=-1.25,p.vu*=-.4;if(p.z>ZP+.5)p.z=ZP+.5,p.vz*=-.3}
      ball.t+=dt;if(phase==='boom'&&ball.t>3){phase='rest'}if(ball.t>5.2)reset()}
    for(const p of ordered){const q=P(p.u,p.z,p.y);g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(q.x,P(p.u,p.z).y,q.s*.14,q.s*.04,0,0,7);g.fill();pinShape(q.x,q.y,q.s,p.rot,p.dir)}
    if(phase==='roll'){const q=P(ball.u,ball.z),r=q.s*.21;g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(q.x,q.y,r,r*.3,0,0,7);g.fill();
      const bg=g.createRadialGradient(q.x-r*.4,q.y-r*1.4,r*.1,q.x,q.y-r,r);bg.addColorStop(0,'#ff9be6');bg.addColorStop(.5,'#b23ad6');bg.addColorStop(1,'#3a0c5c');g.fillStyle=bg;g.beginPath();g.arc(q.x,q.y-r,r,0,7);g.fill();
      g.fillStyle='#16062a';for(const [dx,dy] of [[-.2,-.35],[.15,-.4],[0,-.1]]){g.beginPath();g.arc(q.x+dx*r*Math.cos(ball.t*9),q.y-r+dy*r,r*.11,0,7);g.fill()}}
    g.restore();
    if(flash>0){g.fillStyle=`rgba(255,240,250,${flash*.6})`;g.fillRect(0,0,W,H);flash=Math.max(0,flash-dt*4)}
    requestAnimationFrame(draw)}
  requestAnimationFrame(draw);
  setTimeout(()=>el.classList.add('go'),1750);
  $('#tapPlay').onclick=()=>{el.classList.add('fade');setTimeout(()=>{alive=false;el.hidden=true},450);if(!S.storySeen)showStory()};
})();

requestAnimationFrame(frame);
</script>
